# Plugin
pluginGroup=com.skarlso
pluginVersion=1.0.3

# IntelliJ Platform to build and run against. Since 2025.3 (253) JetBrains publishes a single
# unified IntelliJ IDEA artifact rather than separate Community/Ultimate ones.
# Available versions -> https://www.jetbrains.com/intellij-repository/releases
platformVersion=2026.2.1

# Supported IDE range. sinceBuild stays on 251 (2025.1) so the plugin keeps working on
# older IDEs; untilBuild tracks the branch of platformVersion above.
pluginSinceBuild=251
pluginUntilBuild=262.*

# Disable Gradle Configuration Cache to avoid deprecated warnings
org.gradle.configuration-cache=false

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true

# Suppress specific deprecation warnings from IntelliJ plugin
org.gradle.warning.mode=summary
