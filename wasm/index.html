<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta content="Gergely Brautigam" name="author">
    <meta name="description">
    <meta name="theme-color" content="#2d2c2c">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta property="og:url" content="https://">
    <meta property="og:title" content="CRD to YAML Generator">
    <meta property="og:description">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://">
    <title>CRD to YAML Generator</title>
    <link href="https://raw.githubusercontent.com/maxence-charriere/go-app/master/docs/web/icon.svg" rel="icon">
    <link rel="apple-touch-icon" href="/web/img/logo.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <link href="/app.css" type="text/css" rel="stylesheet">
    <link type="text/css" rel="stylesheet" href="/web/css/cty.css">
    <script defer src="/wasm_exec.js"></script>
    <script defer src="/app.js"></script>
    <script src="/web/js/cty.js"></script>
    <meta charset="utf-8">
			<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
			<meta name="description" content="Generate sample YAML files from Kubernetes CRD definitions with an intuitive web interface">
			<meta name="keywords" content="Kubernetes, CRD, YAML, generator, CustomResourceDefinition">
			<script>
				// Resolved before first paint so the page never flashes the wrong theme.
				(function () {
					var stored = null;
					try { stored = localStorage.getItem('cty-theme'); } catch (e) {}
					var dark = stored ? stored === 'dark'
						: window.matchMedia('(prefers-color-scheme: dark)').matches;
					document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
				})();
			</script>
  </head>
  <body>
    <main></main>
    <aside id="app-wasm-loader" class="goapp-app-info">
      <img id="app-wasm-loader-icon" class="goapp-logo goapp-spin" alt="wasm loader icon" src="/web/img/logo.png">
      <p id="app-wasm-loader-label" class="goapp-label">0%</p>
    </aside>
  </body>
</html>
