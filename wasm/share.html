<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="author" content="Gergely Brautigam">
    <meta name="description">
    <meta name="theme-color" content="#2d2c2c">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta property="og:url" content="https:///share">
    <meta content="CRD to YAML Generator" property="og:title">
    <meta property="og:description">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://">
    <title>CRD to YAML Generator</title>
    <link rel="icon" href="https://raw.githubusercontent.com/maxence-charriere/go-app/master/docs/web/icon.svg">
    <link rel="apple-touch-icon" href="/web/img/logo.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <link href="/app.css" type="text/css" rel="stylesheet">
    <link type="text/css" rel="stylesheet" href="/web/css/cty.css">
    <script defer src="/wasm_exec.js"></script>
    <script src="/app.js" defer></script>
    <script src="/web/js/cty.js"></script>
    <meta charset="utf-8">
			<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
			<meta name="description" content="Generate sample YAML files from Kubernetes CRD definitions with an intuitive web interface">
			<meta name="keywords" content="Kubernetes, CRD, YAML, generator, CustomResourceDefinition">
			<script>
				// Resolved before first paint so the page never flashes the wrong theme.
				(function () {
					var stored = null;
					try { stored = localStorage.getItem('cty-theme'); } catch (e) {}
					var dark = stored ? stored === 'dark'
						: window.matchMedia('(prefers-color-scheme: dark)').matches;
					document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
				})();
			</script>
  </head>
  <body>
    <div class="alert alert-danger fade-in" role="alert">
      <svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
      <div class="grow">
        <p class="strong mb-2">Failed to process CRD</p>
        <p>url parameter has to be define in the following format: /share?url=https://example.com/crd.yaml</p>
      </div>
    </div>
    <aside id="app-wasm-loader" class="goapp-app-info">
      <img id="app-wasm-loader-icon" class="goapp-logo goapp-spin" alt="wasm loader icon" src="/web/img/logo.png">
      <p id="app-wasm-loader-label" class="goapp-label">0%</p>
    </aside>
  </body>
</html>
